<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="matrixGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff88" stroke-width="0.75" stroke-opacity="0.12" />
      <circle cx="30" cy="0" r="1.5" fill="#00ff88" fill-opacity="0.25" />
    </pattern>

    <!-- Circuit Glow Filter -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { r: 2.5; fill-opacity: 0.4; }
        50% { r: 4.5; fill-opacity: 1; filter: drop-shadow(0 0 6px #00ff88); }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes waveScan {
        0% { transform: translateX(-850px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateX(850px); opacity: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { stroke: #00ff88; filter: drop-shadow(0 0 4px rgba(0,255,136,0.3)); }
        50% { stroke: #00e5ff; filter: drop-shadow(0 0 12px rgba(0,229,255,0.6)); }
      }

      .matrix-root {
        cursor: pointer;
      }
      .circuit-line {
        stroke: #00ff88;
        stroke-opacity: 0.35;
        stroke-width: 1.5;
        fill: none;
      }
      .data-packet {
        stroke: #00e5ff;
        stroke-width: 2.5;
        stroke-dasharray: 20, 180;
        animation: dataFlow 3s infinite linear;
        fill: none;
      }
      .node-p1 { animation: pulseNode 2.4s infinite ease-in-out; fill: #00ff88; }
      .node-p2 { animation: pulseNode 3.1s infinite ease-in-out 0.6s; fill: #00e5ff; }
      .node-p3 { animation: pulseNode 2.8s infinite ease-in-out 1.2s; fill: #00ffaa; }

      .center-card {
        fill: #080d1a;
        fill-opacity: 0.92;
        stroke-width: 1.6;
        rx: 10;
        ry: 10;
        animation: badgePulse 4s infinite ease-in-out;
        transition: all 0.35s ease;
      }
      .name-header {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace;
        font-weight: 900;
        font-size: 23px;
        fill: #ffffff;
        letter-spacing: 2px;
        transition: fill 0.3s ease;
      }
      .sub-header {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-weight: 600;
        font-size: 12px;
        fill: #00ffaa;
        letter-spacing: 2.2px;
        transition: fill 0.3s ease;
      }

      /* Hover States */
      .matrix-root:hover .center-card {
        fill: #0b1329;
        fill-opacity: 0.98;
        stroke: #00e5ff;
        stroke-width: 2.4;
        filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.8)) drop-shadow(0 0 35px rgba(0, 255, 136, 0.4));
      }
      .matrix-root:hover .circuit-line {
        stroke-opacity: 0.75;
        stroke: #00e5ff;
      }
      .matrix-root:hover .data-packet {
        stroke: #00ff88;
        animation-duration: 1.5s;
      }
      .matrix-root:hover .name-header {
        fill: #00e5ff;
      }
      .matrix-root:hover .sub-header {
        fill: #00ff88;
        filter: drop-shadow(0 0 6px #00ff88);
      }
    </style>
  </defs>

  <g class="matrix-root">
    <!-- Deep Canvas -->
    <rect width="100%" height="100%" fill="#040711" rx="10" />

    <!-- Digital Matrix Dot & Grid Pattern -->
    <rect width="100%" height="100%" fill="url(#matrixGrid)" rx="10" />

    <!-- Interactive Circuit Traces (Left & Right) -->
    <!-- Left Circuit Web -->
    <path d="M 0 30 L 70 30 L 110 60 L 150 60" class="circuit-line" />
    <path d="M 0 30 L 70 30 L 110 60 L 150 60" class="data-packet" />
    
    <path d="M 0 130 L 90 130 L 130 95 L 150 95" class="circuit-line" />
    <path d="M 0 130 L 90 130 L 130 95 L 150 95" class="data-packet" style="animation-delay: 1s;" />

    <path d="M 40 0 L 40 45 L 80 80 L 120 80" class="circuit-line" />

    <!-- Right Circuit Web -->
    <path d="M 850 30 L 780 30 L 740 60 L 700 60" class="circuit-line" />
    <path d="M 850 30 L 780 30 L 740 60 L 700 60" class="data-packet" style="animation-delay: 0.5s;" />

    <path d="M 850 130 L 760 130 L 720 95 L 700 95" class="circuit-line" />
    <path d="M 850 130 L 760 130 L 720 95 L 700 95" class="data-packet" style="animation-delay: 1.5s;" />

    <path d="M 810 0 L 810 45 L 770 80 L 730 80" class="circuit-line" />

    <!-- Matrix Node Points -->
    <circle cx="70" cy="30" class="node-p1" />
    <circle cx="110" cy="60" class="node-p2" />
    <circle cx="90" cy="130" class="node-p3" />
    <circle cx="130" cy="95" class="node-p1" />

    <circle cx="780" cy="30" class="node-p2" />
    <circle cx="740" cy="60" class="node-p1" />
    <circle cx="760" cy="130" class="node-p3" />
    <circle cx="720" cy="95" class="node-p2" />

    <!-- Center Card -->
    <g>
      <rect x="145" y="26" width="560" height="108" class="center-card" />
      
      <!-- Tech Corner Brackets -->
      <path d="M 155 42 L 155 34 L 163 34" fill="none" stroke="#00e5ff" stroke-width="2.5" />
      <path d="M 695 42 L 695 34 L 687 34" fill="none" stroke="#00e5ff" stroke-width="2.5" />
      <path d="M 155 118 L 155 126 L 163 126" fill="none" stroke="#00e5ff" stroke-width="2.5" />
      <path d="M 695 118 L 695 126 L 687 126" fill="none" stroke="#00e5ff" stroke-width="2.5" />

      <!-- Center Text -->
      <text x="425" y="72" text-anchor="middle" class="name-header">CHANDIMA MAHELA</text>
      <text x="425" y="100" text-anchor="middle" class="sub-header">// AI ENGINEER &amp; SOLUTIONS ARCHITECT //</text>
    </g>
  </g>
</svg>
